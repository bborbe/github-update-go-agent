name: Validate Tag Build

# Build-only validation on every tag push. Builds at the exact tag so the
# embedded version always matches the tag (version-true by construction) —
# catches a release tag that would not build BEFORE any image is published.
#
# NO image is pushed here, deliberately (decision 2026-08-27): publishing to
# Docker Hub is a manual, human-owned action per [[Build and publish
# github-update-go-agent image on release]] — the operator runs `make buca`
# (VERSION=<tag>) when an image is actually needed. A docker-build-agent is
# planned later to take over that duty. The nuke deploy mirrors + rolls
# separately.

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so `git describe --tags --exact-match HEAD` resolves
          # the pushed tag (make build's check-version-tag guard requires it).
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build image at the exact tag
        run: make build
        env:
          VERSION: ${{ github.ref_name }}
