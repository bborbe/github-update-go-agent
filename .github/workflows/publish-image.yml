name: Publish Image

# Publishes the agent image to Docker Hub on every tag push. Builds at the
# exact tag so the embedded version always matches the tag (version-true by
# construction — closes the "released tag has no image" gap and the
# pre-merge-tree drift where v0.9.6 shipped Go 1.26.6 from an off-tag build).
# Registry push only; no cluster mutation — the nuke deploy mirrors + rolls
# separately.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so `git describe --tags --exact-match HEAD` resolves
          # the pushed tag (make build's check-version-tag guard requires it).
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish image
        run: make build && make upload
        env:
          VERSION: ${{ github.ref_name }}

      - name: Verify published image
        run: docker manifest inspect docker.io/bborbe/github-update-go-agent:${{ github.ref_name }}
